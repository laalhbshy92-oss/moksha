name: Build Moksha APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Backup google-services.json
        run: |
          if [ -f android/app/google-services.json ]; then
            cp android/app/google-services.json /tmp/google-services.json
          fi
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.6'
          channel: 'stable'
      - name: Create project
        run: flutter create --platforms=android --org com.moksha --project-name app .
      - name: Restore google-services.json
        run: |
          if [ -f /tmp/google-services.json ]; then
            mkdir -p android/app
            cp /tmp/google-services.json android/app/google-services.json
          fi
      - name: Fix lib files
        run: |
          cat > lib/firebase_options.dart << 'EOF'
          import 'package:firebase_core/firebase_core.dart' show FirebaseOptions;
          class DefaultFirebaseOptions {
            static FirebaseOptions get currentPlatform => android;
            static const FirebaseOptions android = FirebaseOptions(
              apiKey: 'AIzaSyCV14PVPFRN_DqqqvasquII0x5BdwZ5mLc',
              appId: '1:410725291193:android:dd506e6519e83561c9b768',
              messagingSenderId: '410725291193',
              projectId: 'moksha-app-ce6e3',
              storageBucket: 'moksha-app-ce6e3.firebasestorage.app',
            );
          }
          EOF
          cat > lib/main.dart << 'EOF'
          import 'package:flutter/material.dart';
          import 'package:firebase_core/firebase_core.dart';
          import 'firebase_options.dart';
          void main() async {
            WidgetsFlutterBinding.ensureInitialized();
            await Firebase.initializeApp(options: DefaultFirebaseOptions.currentPlatform);
            runApp(const MyApp());
          }
          class MyApp extends StatelessWidget {
            const MyApp({super.key});
            @override
            Widget build(BuildContext context) {
              return MaterialApp(
                debugShowCheckedModeBanner: false,
                home: Scaffold(
                  backgroundColor: Colors.white,
                  body: Center(child: Text("Moksha + Firebase شغال ✅", style: TextStyle(fontSize: 24, fontWeight: FontWeight.bold))),
                ),
              );
            }
          }
          EOF
      - name: Build APK
        run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: moksha-apk
          path: build/app/outputs/flutter-apk/app-release.apk
