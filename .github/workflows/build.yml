name: Build Moksha APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'
      - name: Create clean project
        run: flutter create --platforms=android --org com.moksha --project-name app .
      - name: Write simple main
        run: |
          python3 -c "code='''import \"package:flutter/material.dart\";\nvoid main()=>runApp(const MyApp());\nclass MyApp extends StatelessWidget{const MyApp({super.key});@override Widget build(BuildContext c){return MaterialApp(debugShowCheckedModeBanner:false,home:Scaffold(body:Center(child:Text('Moksha شغال ✅',style:TextStyle(fontSize:28)))));}}''';open('lib/main.dart','w',encoding='utf-8').write(code)"
      - run: flutter pub get
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: moksha-apk
          path: build/app/outputs/flutter-apk/app-release.apk
